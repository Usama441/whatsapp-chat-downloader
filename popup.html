<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Chat Downloader</title>
  <style>
    body {
      width: 300px;
      height: 200px;
      margin: 0;
      background: linear-gradient(135deg, #1a1a1a 0%, #4a1a4a 100%);
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #b19cd9;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
    }
    .highlight {
      color: #8a2be2;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>📥 WhatsApp Chat Downloader</h1>
  <p>Navigate to <strong class="highlight">web.whatsapp.com</strong> and open a chat. A <strong class="highlight">Download Chat</strong> button will appear in the chat header.</p>
  <p>Click the button to download the visible messages as a text file.</p>
  <p><em>Note: Scroll to load all messages before downloading.</em></p>
</body>
</html>
